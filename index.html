<!-- Encart Tamagotchi (à intégrer dans votre dashboard) -->
<div class="widget-tamagotchi">
    <!-- Zone gauche invisible pour ajouter +1 tâche -->
    <div class="zone-action zone-gauche" onclick="ajouterTache()"></div>
    
    <!-- Zone droite invisible pour réinitialiser à 0 -->
    <div class="zone-action zone-droite" onclick="resetTamagotchi()"></div>

    <!-- Le conteneur du personnage -->
    <div class="tamagotchi-container">
        <div id="avatar" class="pixel-avatar etat-neutre"></div>
    </div>
</div>

<style>
/* 1. L'ENCART DU DASHBOARD */
.widget-tamagotchi {
    position: relative;
    width: 200px;
    height: 200px;
    background-color: #111111; /* Fond très sombre */
    border-radius: 12px;
    overflow: hidden;
}

/* Zones tactiles invisibles (gauche et droite) */
.zone-action {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
    cursor: pointer;
}
.zone-gauche { left: 0; }
.zone-droite { right: 0; }

/* Centrage du personnage */
.tamagotchi-container {
    width: 100%;
    height: 100%;
    display: flex;
    -webkit-box-align: center; /* Alignement vieux WebKit */
    align-items: center;
    -webkit-box-pack: center;
    justify-content: center;
}

/* 2. LE DESIGN EN PIXEL CSS (Chaque pixel fait 5px par 5px) */
.pixel-avatar {
    width: 5px;
    height: 5px;
    background: transparent;
    position: relative;
    left: -25px; 
    top: -25px;
    
    /* Animation de lévitation fluide pour iOS 10 (GPU activé) */
    -webkit-animation: levitation 2s ease-in-out infinite alternate;
    animation: levitation 2s ease-in-out infinite alternate;
}

/* L'effet de lévitation (Haut/Bas) compatible iPad 4 */
@-webkit-keyframes levitation {
    0% { -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); }
    100% { -webkit-transform: translate3d(0, -10px, 0); transform: translate3d(0, -10px, 0); }
}

@keyframes levitation {
    0% { -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); }
    100% { -webkit-transform: translate3d(0, -10px, 0); transform: translate3d(0, -10px, 0); }
}

/* ÉTAT NEUTRE (Score = 0) : Un petit slime bleu avec un visage normal */
.etat-neutre {
    box-shadow:
        15px 10px #4a90e2, 20px 10px #4a90e2, 25px 10px #4a90e2, 30px 10px #4a90e2,
        10px 15px #4a90e2, 35px 15px #4a90e2,
        5px 20px #4a90e2, 15px 20px #000, 30px 20px #000, 40px 20px #4a90e2, /* Yeux */
        5px 25px #4a90e2, 40px 25px #4a90e2,
        5px 30px #4a90e2, 20px 30px #000, 25px 30px #000, 40px 30px #4a90e2, /* Bouche */
        10px 35px #4a90e2, 15px 35px #4a90e2, 20px 35px #4a90e2, 25px 35px #4a90e2, 30px 35px #4a90e2, 35px 35px #4a90e2;
}

/* ÉTAT HEUREUX (Score >= 3) : Il devient Vert et a un grand sourire */
.etat-heureux {
    box-shadow:
        15px 5px #2ecc71, 20px 5px #2ecc71, 25px 5px #2ecc71, 30px 5px #2ecc71,
        10px 10px #2ecc71, 15px 10px #000, 30px 10px #000, 35px 10px #2ecc71,
        5px 15px #2ecc71, 15px 15px #000, 30px 15px #000, 40px 15px #2ecc71,
        5px 20px #2ecc71, 40px 20px #2ecc71,
        5px 25px #2ecc71, 20px 25px #000, 25px 25px #000, 40px 25px #2ecc71, /* Sourire */
        10px 30px #2ecc71, 15px 30px #2ecc71, 30px 30px #2ecc71, 35px 30px #2ecc71,
        15px 35px #2ecc71, 20px 35px #2ecc71, 25px 35px #2ecc71, 30px 35px #2ecc71;
}

/* ÉTAT TRISTE/ENDORMI (Après 18h et Score = 0) : Il devient Violet, yeux fermés */
.etat-triste {
    box-shadow:
        15px 15px #9b59b6, 20px 15px #9b59b6, 25px 15px #9b59b6, 30px 15px #9b59b6,
        10px 20px #9b59b6, 15px 20px #000, 20px 20px #000, 25px 20px #000, 30px 20px #000, 35px 20px #9b59b6, /* Yeux "-" */
        5px 25px #9b59b6, 40px 25px #9b59b6,
        5px 30px #9b59b6, 20px 30px #000, 25px 30px #000, 40px 30px #9b59b6, /* Bouche triste */
        10px 35px #9b59b6, 15px 35px #9b59b6, 35px 35px #9b59b6;
}
</style>

<script>
// 3. LOGIQUE JAVASCRIPT (Syntaxe ES5 pure et stricte pour iOS 10)
function verifierHumeur() {
    var score = parseInt(localStorage.getItem('tamatogchiScore') || '0', 10);
    var maintenant = new Date();
    var heure = maintenant.getHours();
    
    var avatarElement = document.getElementById('avatar');
    if (!avatarElement) return;

    // Réinitialisation de la classe de base
    avatarElement.className = 'pixel-avatar';

    // Règle 1 : Si le score est supérieur ou égal à 3, il est heureux
    if (score >= 3) {
        avatarElement.className = avatarElement.className + ' etat-heureux';
    } 
    // Règle 2 : S'il est plus de 18h et que le score est à 0, il dort/est triste
    else if (heure >= 18 && score === 0) {
        avatarElement.className = avatarElement.className + ' etat-triste';
    } 
    // Règle 3 : Par défaut, il reste neutre
    else {
        avatarElement.className = avatarElement.className + ' etat-neutre';
    }
}

function ajouterTache() {
    var scoreActuel = parseInt(localStorage.getItem('tamatogchiScore') || '0', 10);
    localStorage.setItem('tamatogchiScore', scoreActuel + 1);
    verifierHumeur();
}

function resetTamagotchi() {
    var confirmation = confirm("Fin de journée ? Réinitialiser le Tamagotchi à zéro ?");
    if (confirmation) {
        localStorage.setItem('tamatogchiScore', '0');
        verifierHumeur();
    }
}

// Initialisation au chargement de la page sur l'iPad
verifierHumeur();

// Vérification de l'heure toutes les minutes pour basculer à 18h automatiquement
setInterval(verifierHumeur, 60000);
</script>
